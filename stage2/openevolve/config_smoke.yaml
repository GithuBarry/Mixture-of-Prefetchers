max_iterations: 1
checkpoint_interval: 1
log_level: "INFO"
random_seed: 42
diff_based_evolution: false
max_code_length: 12000

llm:
  models:
    - name: "meta.llama3-1-8b-instruct-v1:0"
      weight: 1.0
  evaluator_models:
    - name: "meta.llama3-1-8b-instruct-v1:0"
      weight: 1.0
  api_base: "https://ai-gateway.andrew.cmu.edu"
  api_key: ${CMU_AI_GATEWAY_API_KEY}
  temperature: 0.4
  max_tokens: 4096
  timeout: 120
  retries: 2

prompt:
  system_message: |
    You are optimizing a small Stage 2 policy module for a systems research
    project on L2 cache prefetcher coordination.

    Scientific boundary:
    - Fixed cache level: L2C.
    - Fixed expert pair: MLOP + SPP+PPF.
    - Primary comparator: best constituent single expert on the same trace.
    - Secondary comparators: no-prefetch, then the weaker routee.
    - Heldout traces, parser code, dataset code, metric definitions, and
      simulator internals are frozen.

    You may edit only candidate_policy() in the submitted Python program. It
    must return a small dictionary with generic policy knobs. The router must
    stay within the frozen Stage 2 seed families, MoP-V1.1 or MoP-V1.2. The
    other allowed knobs are mop_total_budget, mop_one_shot_epochs, mop_accuracy_floor,
    mop_guarded_min_budget_share, and mop_score_weights.
    The returned dictionary must not include metric names. Never add
    n_traces, gm_vs_pair_best, gm_vs_nopref, gm_vs_weaker, beats_weaker_rate,
    catastrophic_rate, both_routees_gt_1_rate, off_rate, both_on_rate,
    single_action_rate, combined_score, or stage_passed.

    Strong Stage 1 facts:
    - MLOP + SPP+PPF has complementary trace strengths: MLOP wins 3/10 search
      traces, SPP+PPF wins 7/10, both are above no-prefetch on 6/10, and the
      expert gap is at least 2 percent on 7/10.
    - The current viable story is to beat no-prefetch and the weaker routee
      while closing the gap to pair-best.
    - Avoid trace-specific or benchmark-specific rules.

    Prefer simple, explainable policies. Do not import data files or modify any
    code outside the evolve block.
  include_artifacts: false
  num_top_programs: 2
  num_diverse_programs: 1

database:
  population_size: 8
  archive_size: 4
  num_islands: 1
  elite_selection_ratio: 0.25
  exploitation_ratio: 0.7
  feature_dimensions:
    - "single_action_rate"
    - "both_on_rate"
  feature_bins: 5

evaluator:
  timeout: 1200
  cascade_evaluation: false
  parallel_evaluations: 1
  max_retries: 0
